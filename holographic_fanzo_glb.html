<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #42f5ef; font-family: monospace; font-size: 14px;
    text-align: center;
  }
  #status {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: #42f5ef44; font-family: monospace; font-size: 10px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="loading">Loading Fanzo...</div>
<div id="status">THE ONE COMPADRE</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>

<script>
// ── Scene ──────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W / H, 0.01, 100);
camera.position.set(0, 6, 22);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ── Lighting ───────────────────────────────────────────────────────
// Key light — cool blue from front-top
const key = new THREE.PointLight(0x88ddff, 4.0, 40);
key.position.set(2, 12, 10);
scene.add(key);

// Fill — soft from left
const fill = new THREE.PointLight(0x4488aa, 2.0, 30);
fill.position.set(-8, 6, 4);
scene.add(fill);

// Rim — behind for edge glow
const rim = new THREE.PointLight(0x42f5ef, 3.0, 20);
rim.position.set(0, 8, -10);
scene.add(rim);

// Under glow — cyan from platform
const under = new THREE.PointLight(0x42f5ef, 2.5, 10);
under.position.set(0, 0, 0);
scene.add(under);

// Ambient
scene.add(new THREE.AmbientLight(0x112233, 1.2));

// ── Platform glow ring ─────────────────────────────────────────────
const ringGeo = new THREE.TorusGeometry(2.8, 0.08, 8, 96);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x42f5ef, transparent: true, opacity: 0.8
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.1;
scene.add(ring);

// ── Holographic material override ──────────────────────────────────
// ── Character config ───────────────────────────────────────────────
const NAME = 'Fanzo';
const MODEL_FILE = 'fanzo.glb';
const HOLO = { body: 0xc8f0ff, emissive: 0x1a6688, glow: 0x42f5ef, speed: 1.3 };

function applyHolographicMaterials(model) {
  const meshes = [];
  model.traverse((obj) => { if (obj.isMesh) meshes.push(obj); });

  meshes.forEach((obj) => {
    const holoMat = new THREE.MeshPhysicalMaterial({
      color: HOLO.body,
      transparent: true,
      opacity: 0.82,
      roughness: 0.12,
      metalness: 0.05,
      emissive: HOLO.emissive,
      emissiveIntensity: 0.55,
      envMapIntensity: 1.2,
    });

    const wireMat = new THREE.MeshBasicMaterial({
      color: HOLO.glow, wireframe: true, transparent: true, opacity: 0.18,
    });

    // Glow shell: pushed out along normals in the shader so it follows the rig
    const glowMat = new THREE.MeshBasicMaterial({
      color: HOLO.glow, transparent: true, opacity: 0.10, side: THREE.BackSide,
    });
    glowMat.onBeforeCompile = (shader) => {
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  transformed += normalize(objectNormal) * 0.015;'
      );
    };

    obj.material = holoMat;

    // Overlays must be skinned too, otherwise they freeze while the body moves
    const makeOverlay = (mat) => {
      let o;
      if (obj.isSkinnedMesh) {
        o = new THREE.SkinnedMesh(obj.geometry, mat);
        o.bind(obj.skeleton, obj.bindMatrix);
      } else {
        o = new THREE.Mesh(obj.geometry, mat);
      }
      o.position.copy(obj.position);
      o.quaternion.copy(obj.quaternion);
      o.scale.copy(obj.scale);
      o.frustumCulled = false;
      obj.parent.add(o);
    };
    makeOverlay(wireMat);
    makeOverlay(glowMat);
    obj.frustumCulled = false;
  });
}

// ── Load GLB + movement ────────────────────────────────────────────
const loader = new THREE.GLTFLoader();
let model = null;
let mixer = null;
let actions = {};
let baseAction = null;
let busy = false;
let touchStartX = 0, touchMoved = false, dragging = false, userYaw = 0;

function playBase(name) {
  const next = actions[name];
  if (!next || next === baseAction) return;
  if (baseAction) baseAction.fadeOut(0.4);
  next.reset().fadeIn(0.4).play();
  baseAction = next;
}

// One-shot gesture, then glide back to idle
function gesture(name) {
  const a = actions[name];
  if (!a || busy) return;
  busy = true;
  if (baseAction) baseAction.fadeOut(0.25);
  a.reset();
  a.setLoop(THREE.LoopOnce, 1);
  a.clampWhenFinished = true;
  a.fadeIn(0.25).play();
  const done = (e) => {
    if (e.action !== a) return;
    mixer.removeEventListener('finished', done);
    a.fadeOut(0.35);
    const idle = actions['Idle_15'];
    if (idle) { idle.reset().fadeIn(0.35).play(); baseAction = idle; }
    busy = false;
  };
  mixer.addEventListener('finished', done);
}

loader.load(
  MODEL_FILE,
  (gltf) => {
    model = gltf.scene;

    // Rigged meshes: use the mesh's own bounds (the armature's 0.01 scale lives in the bones)
    let box = null;
    model.traverse((o) => {
      if (o.isSkinnedMesh) {
        o.geometry.computeBoundingBox();
        box = box ? box.union(o.geometry.boundingBox) : o.geometry.boundingBox.clone();
      }
    });
    if (!box) box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 8 / maxDim;

    model.scale.setScalar(scale);
    model.position.x = -center.x * scale;
    model.position.y = -center.y * scale + 4;
    model.position.z = -center.z * scale;

    applyHolographicMaterials(model);
    scene.add(model);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => { actions[clip.name] = mixer.clipAction(clip); });
      if (actions['Idle_15']) playBase('Idle_15');
      else mixer.clipAction(gltf.animations[0]).play();
      setTimeout(() => gesture('Big_Wave_Hello'), 800);
    }

    document.getElementById('loading').style.display = 'none';
  },
  (progress) => {
    if (!progress.total) return;
    const pct = Math.round((progress.loaded / progress.total) * 100);
    document.getElementById('loading').textContent = `Loading ${NAME}... ${pct}%`;
  },
  (error) => {
    document.getElementById('loading').textContent = 'Error loading model';
    console.error(error);
  }
);

// Every so often, do a small "helping" gesture so they never just stand there
const GESTURES = ['Talk_with_Hands_Open', 'Talk_with_Left_Hand_on_Hip', 'Discuss_While_Moving'];
function scheduleGesture() {
  setTimeout(() => {
    if (!document.hidden) gesture(GESTURES[Math.floor(Math.random() * GESTURES.length)]);
    scheduleGesture();
  }, 9000 + Math.random() * 9000);
}
scheduleGesture();

// ── Animation loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();
let t = 0;
let baseY = null;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1); // read delta once per frame
  t += delta;

  if (mixer) mixer.update(delta);

  if (model) {
    if (baseY === null) baseY = model.position.y;
    model.position.y = baseY + Math.sin(t * HOLO.speed) * 0.055;   // gentle hover
    if (!dragging) model.rotation.y = userYaw + Math.sin(t * 0.32) * 0.12; // slow sway
  }

  ring.material.opacity = 0.5 + Math.sin(t * 1.8) * 0.3;
  ring.scale.setScalar(1 + Math.sin(t * 1.8) * 0.025);
  under.intensity = 2.0 + Math.sin(t * 1.8) * 0.8;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ── Touch: drag to rotate, tap to wave ─────────────────────────────
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchMoved = false; dragging = true; });
document.addEventListener('touchmove', e => {
  if (!model) return;
  const dx = e.touches[0].clientX - touchStartX;
  if (Math.abs(dx) > 3) touchMoved = true;
  userYaw += dx * 0.01;
  model.rotation.y = userYaw;
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', () => { dragging = false; if (!touchMoved) gesture('Big_Wave_Hello'); });
document.addEventListener('click', () => gesture('Big_Wave_Hello'));
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #b44fff; font-family: monospace; font-size: 14px;
    text-align: center;
  }
  #status {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: #b44fff44; font-family: monospace; font-size: 10px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="loading">Loading Echo...</div>
<div id="status">THE ONE COMPADRE</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>

<script>
const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W/H, 0.01, 100);
camera.position.set(0, 6, 22);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// Purple lighting for Echo
const key = new THREE.PointLight(0xcc88ff, 4.0, 40);
key.position.set(2, 12, 10);
scene.add(key);

const fill = new THREE.PointLight(0x6644aa, 2.0, 30);
fill.position.set(-8, 6, 4);
scene.add(fill);

const rim = new THREE.PointLight(0xb44fff, 3.0, 20);
rim.position.set(0, 8, -10);
scene.add(rim);

const under = new THREE.PointLight(0xb44fff, 2.5, 10);
under.position.set(0, 0, 0);
scene.add(under);

scene.add(new THREE.AmbientLight(0x1a0a2e, 1.2));

// Purple glow ring
const ringGeo = new THREE.TorusGeometry(2.8, 0.08, 8, 96);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xb44fff, transparent: true, opacity: 0.8
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.1;
scene.add(ring);

function applyHolographicMaterials(model) {
  model.traverse((obj) => {
    if (!obj.isMesh) return;

    const holoMat = new THREE.MeshPhysicalMaterial({
      color: 0xe8c8ff,
      transparent: true,
      opacity: 0.82,
      roughness: 0.12,
      metalness: 0.05,
      emissive: 0x4a1a88,
      emissiveIntensity: 0.55,
      envMapIntensity: 1.2,
    });

    const wireMat = new THREE.MeshBasicMaterial({
      color: 0xb44fff,
      wireframe: true,
      transparent: true,
      opacity: 0.18,
    });

    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xb44fff,
      transparent: true,
      opacity: 0.10,
      side: THREE.BackSide,
    });

    obj.material = holoMat;

    const wireObj = new THREE.Mesh(obj.geometry, wireMat);
    obj.parent.add(wireObj);

    const glowObj = new THREE.Mesh(obj.geometry, glowMat);
    glowObj.scale.setScalar(1.04);
    obj.parent.add(glowObj);
  });
}

const loader = new THREE.GLTFLoader();
let echo = null;
let mixer = null;

loader.load(
  'echo.glb',
  (gltf) => {
    echo = gltf.scene;

    const box = new THREE.Box3().setFromObject(echo);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 8 / maxDim;

    echo.scale.setScalar(scale);
    echo.position.x = -center.x * scale;
    echo.position.y = -center.y * scale + 4;
    echo.position.z = -center.z * scale;

    applyHolographicMaterials(echo);
    scene.add(echo);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(echo);
      const action = mixer.clipAction(gltf.animations[0]);
      action.play();
    }

    document.getElementById('loading').style.display = 'none';
  },
  (progress) => {
    const pct = Math.round((progress.loaded / progress.total) * 100);
    document.getElementById('loading').textContent = `Loading Echo... ${pct}%`;
  },
  (error) => {
    document.getElementById('loading').textContent = 'Error loading model';
    console.error(error);
  }
);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  if (echo) {
    echo.position.y = (echo.position.y - Math.sin((t - delta) * 1.1) * 0.055) +
                       Math.sin(t * 1.1) * 0.055;
    echo.rotation.y = Math.sin(t * 0.32) * 0.12;
  }

  ring.material.opacity = 0.5 + Math.sin(t * 1.8) * 0.3;
  ring.scale.setScalar(1 + Math.sin(t * 1.8) * 0.025);
  under.intensity = 2.0 + Math.sin(t * 1.8) * 0.8;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchmove', e => {
  if (!echo) return;
  const dx = e.touches[0].clientX - touchStartX;
  echo.rotation.y += dx * 0.01;
  touchStartX = e.touches[0].clientX;
});
</script>
</body>
</html>
